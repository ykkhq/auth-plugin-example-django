_format_version: "3.0"
_konnect:
  control_plane_name: django-apigw
certificates:
# Server cert for the AI Gateway -> Kong Gateway https hop, signed by the
# private CA from kong/gen-tls.sh. Contents come from env so the key never
# lands in git:
# (PEM flattened to one line with \n escapes so it fits a quoted scalar):
#   export DECK_GW_TLS_CERT="$(awk '{printf "%s\\n",$0}' kong/tls/server.crt)"
#   export DECK_GW_TLS_KEY="$(awk '{printf "%s\\n",$0}' kong/tls/server.key)"
- id: 22230d19-e1aa-4908-a779-fc8e227405b7
  cert: "${{ env "DECK_GW_TLS_CERT" }}"
  key: "${{ env "DECK_GW_TLS_KEY" }}"
  snis:
  - name: host.docker.internal
consumers:
- basicauth_credentials:
  - password: 3f788a76c4480000de899fae3abec529991b28aa
    username: user1
  keyauth_credentials:
  - key: awsome user1
  - key: test
  username: user1
plugins:
- config:
    nodes:
    - name: creds
      output: null
      outputs: null
      type: static
      values:
        password: awesome user1
        username: user1
    - input: null
      inputs:
        password: creds.password
        username: creds.username
      jq: '{ Authorization: ("Basic " + ("\(.username):\(.password)" | @base64)) }'
      name: Create_Basic_Auth
      output: service_request.headers
      type: jq
  enabled: true
  instance_name: Creat_basic_auth
  name: datakit
  protocols:
  - http
  - https
  route: django-route-items
  service: django-api-items
- enabled: true
  instance_name: keyauth-to-basic
  name: key-auth
  protocols:
  - http
  - https
  - ws
  - wss
  route: django-route-items
  service: django-api-items
- config:
    access:
    - |-
      local http = require "resty.http"
                        local cjson = require "cjson.safe"

                        -- Sample-only: hardcoded upstream login URL + shared
                        -- service-account credentials. In a real deployment,
                        -- source the password from a Kong Vault reference, e.g.
                        -- config templated as "{vault://env/DJANGO_SERVICE_PASSWORD}",
                        -- and make the login URL an env/vault value too.
                        local django_login_url = "http://django:3333/api/auth/login/"
                        local service_username = "kong_service"
                        local service_password = "kong-service-demo-pw"

                        local httpc = http.new()
                        local res, err = httpc:request_uri(django_login_url, {
                          method = "POST",
                          body = cjson.encode({
                            username = service_username,
                            password = service_password,
                          }),
                          headers = {
                            ["Content-Type"] = "application/json",
                          },
                        })

                        if not res then
                          kong.log.err("django session login request failed: ", err)
                          return kong.response.exit(502, { message = "upstream session login failed" })
                        end

                        if res.status ~= 200 then
                          kong.log.err("django rejected service-account login, status=", res.status)
                          return kong.response.exit(502, { message = "upstream session login rejected" })
                        end

                        -- Django's login() always calls rotate_token() (a CSRF
                        -- fixation defense), so this response carries TWO
                        -- Set-Cookie headers -- csrftoken first, then sessionid.
                        -- Scan all of them for the one we actually want instead
                        -- of assuming the first entry is it.
                        local set_cookie = res.headers["Set-Cookie"]
                        local session_id

                        if type(set_cookie) == "table" then
                          for _, cookie in ipairs(set_cookie) do
                            session_id = cookie:match("sessionid=([^;]+)")
                            if session_id then
                              break
                            end
                          end
                        elseif set_cookie then
                          session_id = set_cookie:match("sessionid=([^;]+)")
                        end

                        if not session_id then
                          kong.log.err("no sessionid cookie in django login response")
                          return kong.response.exit(502, { message = "upstream did not return a session" })
                        end

                        -- NOTE (sample simplification): this logs into Django on
                        -- every proxied request. A production version should
                        -- cache the sessionid per worker (e.g. kong.cache or an
                        -- ngx.shared.DICT) keyed on nothing-request-specific,
                        -- with a TTL kept below Django's SESSION_COOKIE_AGE, and
                        -- only re-login on a cache miss or after Django returns
                        -- 401/403 for the cached session.
                        kong.service.request.set_header("Cookie", "sessionid=" .. session_id)
    header_filter:
    - kong.response.clear_header("Set-Cookie")
  enabled: false
  instance_name: kong-to-django-idpw-login
  name: pre-function
  protocols:
  - http
  - https
  route: django-route-items
  service: django-api-items
# --- OIDC route (/oidc/inventory): Auth0 login for browsers (session cookie)
# and OAuth2 for curl/apps (Bearer JWT or client_credentials). Values come
# from env, see kong/auth0.env.example and README "OIDC with Auth0".
- config: &basic_auth_datakit
    nodes:
    - name: creds
      type: static
      values:
        password: awesome user1
        username: user1
    - inputs:
        password: creds.password
        username: creds.username
      jq: '{ Authorization: ("Basic " + ("\(.username):\(.password)" | @base64)) }'
      name: Create_Basic_Auth
      output: service_request.headers
      type: jq
  enabled: true
  instance_name: oidc-create-basic-auth
  name: datakit
  protocols:
  - http
  - https
  route: django-route-items-oidc
- config: &auth0_oidc_config
    issuer: "${{ env "DECK_AUTH0_ISSUER" }}"
    # Required on Kong 3.16+: tls_certificate_verify is on globally, and the
    # DP rejects the whole config if ssl_verify is left at its default (false).
    # Auth0 uses a public CA (KONG_LUA_SSL_TRUSTED_CERTIFICATE=system).
    ssl_verify: true
    client_id:
    - "${{ env "DECK_AUTH0_WEB_CLIENT_ID" }}"
    client_secret:
    - "${{ env "DECK_AUTH0_WEB_CLIENT_SECRET" }}"
    client_auth:
    - client_secret_post
    redirect_uri:
    - https://localhost:8443/oidc/inventory/
    scopes:
    - openid
    - profile
    - email
    # Browser login, then Kong session cookie. Apps (Authorization header)
    # are routed to django-route-items-oidc-m2m instead, see below.
    auth_methods:
    - authorization_code
    - session
    client_credentials_param_type:
    - header
    # Auth0 only issues JWT access tokens when an API audience is requested
    audience_required:
    - "${{ env "DECK_AUTH0_AUDIENCE" }}"
    # Sent on the authorize redirect. Kong's client_credentials token request
    # doesn't carry it, so the Auth0 tenant's Default Audience must be this API.
    audience:
    - "${{ env "DECK_AUTH0_AUDIENCE" }}"
    # Browser session management (Kong-side encrypted cookie)
    session_secret: "${{ env "DECK_OIDC_SESSION_SECRET" }}"
    cache_tokens_salt: "${{ env "DECK_OIDC_CACHE_TOKENS_SALT" }}"
    session_cookie_name: inventory_session
    session_cookie_secure: true
    session_cookie_http_only: true
    session_cookie_same_site: Lax
    session_idling_timeout: 900
    session_rolling_timeout: 3600
    session_absolute_timeout: 28800
    # GET/POST /oidc/inventory/logout -> drop session, Auth0 end_session
    logout_uri_suffix: /logout
    logout_methods:
    - GET
    - POST
    logout_redirect_uri:
    - https://localhost:8443/oidc/inventory/
    # Pass the authenticated identity to Django
    upstream_headers_claims:
    - sub
    - email
    upstream_headers_names:
    - X-Authenticated-User
    - X-Authenticated-Email
  enabled: true
  instance_name: auth0-oidc
  name: openid-connect
  protocols:
  - http
  - https
  route: django-route-items-oidc
# --- Machine route: same path, but only requests carrying an Authorization
# header (Bearer JWT or Basic client id:secret). Separate plugin instance
# because Auth0 refuses client_credentials requests that ask for the
# openid/profile/email scopes the browser login needs, and the plugin sends
# its "scopes" on every token request.
- config:
    <<: *auth0_oidc_config
    auth_methods:
    - bearer
    - client_credentials
    scopes: []
  enabled: true
  instance_name: auth0-oidc-m2m
  name: openid-connect
  protocols:
  - http
  - https
  route: django-route-items-oidc-m2m
- config: *basic_auth_datakit
  enabled: true
  instance_name: oidc-m2m-create-basic-auth
  name: datakit
  protocols:
  - http
  - https
  route: django-route-items-oidc-m2m
# --- Per-user rate limit on the OIDC API routes. openid-connect turns the
# token's "sub" claim into a virtual credential (credential_claim, default
# [sub]), so limit_by: credential counts each Auth0 user / M2M client
# separately without Kong consumers. Runs after openid-connect (lower
# priority). policy: local = counters per data plane node; use redis when
# running several nodes.
- config: &per_user_rate_limit
    limit_by: credential
    minute: 10
    hour: 200
    policy: local
  enabled: true
  instance_name: oidc-rate-limit-browser
  name: rate-limiting
  protocols:
  - http
  - https
  route: django-route-items-oidc
- config: *per_user_rate_limit
  enabled: true
  instance_name: oidc-rate-limit-m2m
  name: rate-limiting
  protocols:
  - http
  - https
  route: django-route-items-oidc-m2m
# --- Web UI route (/items): same Auth0 app and session cookie as
# /oidc/inventory (one login covers both), browser login only. Django's
# RemoteUserBackend logs the user in from X-Authenticated-User, which this
# plugin always overwrites with the verified "sub" claim.
- config:
    <<: *auth0_oidc_config
    redirect_uri:
    - https://localhost:8443/items/
    logout_redirect_uri:
    - https://localhost:8443/items/
    auth_methods:
    - authorization_code
    - session
  enabled: true
  instance_name: auth0-oidc-web
  name: openid-connect
  protocols:
  - http
  - https
  route: django-route-web
# /inventory and /static have no openid-connect plugin to overwrite
# X-Authenticated-User, so strip any client-sent copy before Django sees it.
- config:
    remove:
      headers:
      - X-Authenticated-User
  enabled: true
  instance_name: strip-identity-apikey
  name: request-transformer
  protocols:
  - http
  - https
  route: django-route-items
- config:
    remove:
      headers:
      - X-Authenticated-User
  enabled: true
  instance_name: strip-identity-static
  name: request-transformer
  protocols:
  - http
  - https
  route: django-route-static
# --- Monitoring (monitoring/, Grafana) -----------------------------------
# Global: per-route request / status / latency / bandwidth metrics, served on
# the DP status API and exposed to Prometheus via the kong-metrics route.
- config:
    status_code_metrics: true
    latency_metrics: true
    bandwidth_metrics: true
    upstream_health_metrics: true
  enabled: true
  instance_name: prometheus
  name: prometheus
  protocols:
  - http
  - https
# Global: one JSON line per request on the DP's stdout; Grafana Alloy ships it
# to Loki. Headers are dropped so cookies and tokens never reach the logs;
# "user" is the openid-connect virtual credential (the token's sub claim).
- config:
    path: /dev/stdout
    custom_fields_by_lua:
      request.headers: return nil
      response.headers: return nil
      user: local c = kong.client.get_credential() return c and c.id or nil
  enabled: true
  instance_name: access-log-json
  name: file-log
  protocols:
  - http
  - https
# Only containers on kong-net (Prometheus) may scrape /kong-metrics.
- config:
    allow:
    - 172.18.0.0/16
  enabled: true
  instance_name: kong-metrics-kong-net-only
  name: ip-restriction
  protocols:
  - http
  route: kong-metrics-route
services:
- host: django
  name: django-api-items
  path: /api/items
  port: 3333
  routes:
  - methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    name: django-route-items
    paths:
    - /inventory
    protocols:
    - https
  - methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    name: django-route-items-oidc
    paths:
    - /oidc/inventory
    protocols:
    - https
  - headers:
      Authorization:
      - "~*^(Bearer|Basic) "
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    name: django-route-items-oidc-m2m
    paths:
    - /oidc/inventory
    protocols:
    - https
# Django static assets (DRF browsable API / admin CSS, JS, images), served by
# whitenoise. DRF pages reference them as absolute /static/... URLs, which
# fall outside /oidc/inventory, so they need their own route. Left public on
# purpose: these are stock framework assets with no user data.
- host: django
  name: django-static
  path: /static
  port: 3333
  routes:
  - methods:
    - GET
    - HEAD
    name: django-route-static
    paths:
    - /static
    protocols:
    - https
# Django server-rendered web UI (/items/, /items/add/, ...). No path
# rewrite: Django's own links and redirects already use /items/...
- host: django
  name: django-web
  port: 3333
  routes:
  - methods:
    - GET
    - POST
    name: django-route-web
    paths:
    - /items
    protocols:
    - https
    strip_path: false
# Loopback to this DP's own status API (127.0.0.1:8007), where the
# prometheus plugin serves /metrics. Plain http, kong-net callers only.
- name: kong-metrics
  host: 127.0.0.1
  port: 8007
  path: /metrics
  protocol: http
  routes:
  - methods:
    - GET
    name: kong-metrics-route
    paths:
    - /kong-metrics
    protocols:
    - http
