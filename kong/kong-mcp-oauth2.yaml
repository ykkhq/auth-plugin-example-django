    route: django-route-gw-mcp
    config:
      mode: listener
      server:
        tag: mfg-gw-mcp
        timeout: 60000
        forward_client_headers: true
      include_consumer_groups: true
      logging:
        log_statistics: true
        log_payloads: false
      max_request_body_size: 32768
  - name: ai-mcp-oauth2
    instance_name: gw-mcp-auth0
