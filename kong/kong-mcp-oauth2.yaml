      include_consumer_groups: true
      tools:
        - name: list-shipping-statuses
          description: List shipment status history, newest first. Filter by shipment or status.
          method: GET
          path: /gw-mcp/tools/shipping-statuses/
          parameters:
            - name: shipment
              in: query
              required: false
              schema:
                type: integer
            - name: status
              in: query
              required: false
              schema:
                type: string
                enum:
                  - delivered
                  - exception
                  - in_transit
                  - pending
                  - picked
                  - returned
                  - scheduled
          annotations:
            title: List shipping status events
            read_only_hint: true
          acl:
            allow:
              - sales
              - manager
              - admin
        - name: create-shipping-status
          description: Append a status event and move the shipment to that status. The first in_transit
            deducts the order's line quantities from stock (409 if short) and marks the order shipped;
            delivered marks the order delivered.
          method: POST
          path: /gw-mcp/tools/shipping-statuses/
          request_body:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    shipment:
                      type: integer
                    status:
                      enum:
                        - pending
                        - scheduled
                        - picked
                        - in_transit
                        - delivered
                        - exception
                        - returned
                      type: string
                    location:
                      type: string
                      maxLength: 200
                    note:
                      type: string
                    occurred_at:
                      type: string
                      format: date-time
                      description: Defaults to now.
                  required:
                    - shipment
                    - status
          annotations:
            title: Record a new shipping status for a shipment
          acl:
            allow:
              - manager
              - admin
        - name: get-shipping-status
          description: Retrieve one status event by its id.
          method: GET
          path: /gw-mcp/tools/shipping-statuses/{id}/
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
              description: A unique integer value identifying this shipment status event.
          annotations:
            title: Get a shipping status event
            read_only_hint: true
          acl:
            allow:
              - sales
              - manager
              - admin
      logging:
        log_statistics: true
        log_payloads: false
