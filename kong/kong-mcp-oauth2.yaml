# edit by hand; change the API (views/serializers) and re-run the script.
#
# Kong Gateway 3.16 MCP server with Auth0 user login (MCP authorization spec).
# Synced together with kong/kong.yaml and kong/kong-mcp-legacy-auth.yaml (OAuth
# discovery for 2025-03-26 MCP clients); decK sync deletes what no file declares:
#   deck gateway sync kong/kong.yaml kong/kong-mcp-oauth2.yaml kong/kong-mcp-legacy-auth.yaml ...
#
#   MCP client --Auth0 JWT--> Kong GW /gw-mcp/mfg   ai-mcp-proxy listener (all 50 tools)
#                                                   ai-mcp-oauth2 (aud = resource), rate limit
#     tool call (internal) --> /gw-mcp/tools/<resource>/...   ai-mcp-proxy conversion-only
#                                                   openid-connect bearer, datakit
#              --Basic-->  Django :3333/api/<resource>/...
#
# ai-mcp-oauth2 can't share a route with conversion-listener, hence conversion-only
# routes + one listener. Tool calls re-enter Kong through the tool routes with the
# client's headers (passthrough_credentials keeps the JWT), so openid-connect there
# validates the same token and rejects direct calls without one.
#
# Tools by role: ai-mcp-oauth2 and openid-connect map the token's mfg_roles claim to
# the consumer groups sales/manager/admin below; each tool's acl allows only its
# roles, so the listener's tools/list is filtered and other calls get 403.
