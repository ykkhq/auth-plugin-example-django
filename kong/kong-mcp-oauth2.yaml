    config:
      resource: https://localhost:8443/gw-mcp/mfg
      authorization_servers:
        - ${{ env "DECK_AUTH0_ISSUER_URL" }}
      metadata_discovery_endpoint: ${{ env "DECK_AUTH0_ISSUER" }}
      scopes_supported:
        - openid
        - profile
        - email
      passthrough_credentials: true
      consumer_optional: true
      consumer_groups_claim:
        - mfg_roles
      consumer_groups_optional: false
