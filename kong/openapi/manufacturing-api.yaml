  /shipping-schedule/:
    get:
      operationId: shipping_schedule_list
      description: Shipments ordered by scheduled ship date. Filter with ship_from / ship_to (dates),
        status and carrier. Shipments without a scheduled date are excluded.
      summary: Get the shipping schedule.
      parameters:
        - in: query
          name: carrier
          schema:
            type: string
        - in: query
          name: ship_from
          schema:
            type: string
            format: date
          description: Scheduled ship date on or after (YYYY-MM-DD).
        - in: query
          name: ship_to
          schema:
            type: string
            format: date
          description: Scheduled ship date on or before (YYYY-MM-DD).
        - in: query
          name: status
          schema:
            type: string
            enum:
              - delivered
              - exception
              - in_transit
              - pending
              - picked
              - returned
              - scheduled
      tags:
        - shipping-schedule
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
          description: ''
  /shipping-statuses/:
    get:
      operationId: shipping_statuses_list
      description: List shipment status history, newest first. Filter by shipment or status.
      summary: List shipping status events.
      parameters:
        - in: query
          name: shipment
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum:
              - delivered
              - exception
              - in_transit
              - pending
              - picked
              - returned
              - scheduled
      tags:
        - shipping-statuses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentStatusEvent'
          description: ''
    post:
      operationId: shipping_statuses_create
      description: Append a status event and move the shipment to that status. The first in_transit deducts
        the order's line quantities from stock (409 if short) and marks the order shipped; delivered marks
        the order delivered.
      summary: Record a new shipping status for a shipment.
      tags:
        - shipping-statuses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentStatusEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShipmentStatusEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShipmentStatusEventRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentStatusEvent'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
