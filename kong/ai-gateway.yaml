                    minLength: 1
                    maxLength: 32
                  order:
                    type: integer
                  carrier:
                    type: string
                    maxLength: 100
                  tracking_number:
                    type: string
                    maxLength: 100
                  scheduled_ship_date:
                    type: string
                    format: date
                  scheduled_delivery_date:
                    type: string
                    format: date
                required:
                  - order
                  - shipment_number
        annotations:
          title: Create a shipment
      - name: get-shipment
