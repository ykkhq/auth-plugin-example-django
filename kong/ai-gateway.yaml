                      - submitted
                      - confirmed
                      - partially_received
                      - received
                      - cancelled
                    type: string
                  order_date:
                    type: string
                    format: date
                  expected_date:
                    type: string
                    format: date
                  notes:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        item:
                          type: integer
                        quantity:
                          type: integer
                          maximum: 9223372036854775807
                          minimum: 1
                          format: int64
                        unit_cost:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                      required:
                        - item
                        - quantity
                        - unit_cost
                required:
                  - order_date
                  - po_number
                  - supplier
        annotations:
          title: Replace a purchase order
          idempotent_hint: true
      - name: patch-purchase-order
        description: Update only the given fields of an existing purchase order (PATCH).
        method: PATCH
        path: /mcp-oidc/mfg/purchase-orders/{id}/
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
            description: A unique integer value identifying this purchase order.
        request_body:
          required: false
          content:
            application/json:
              schema:
                type: object
                properties:
                  po_number:
                    type: string
                    minLength: 1
                    maxLength: 32
                  supplier:
                    type: integer
                  status:
                    enum:
                      - draft
                      - submitted
                      - confirmed
                      - partially_received
                      - received
                      - cancelled
                    type: string
                  order_date:
                    type: string
                    format: date
                  expected_date:
                    type: string
                    format: date
                  notes:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        item:
                          type: integer
                        quantity:
                          type: integer
                          maximum: 9223372036854775807
                          minimum: 1
                          format: int64
                        unit_cost:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                      required:
                        - item
                        - quantity
                        - unit_cost
        annotations:
          title: Update a purchase order
      - name: delete-purchase-order
        description: Permanently delete a purchase order by its id.
        method: DELETE
        path: /mcp-oidc/mfg/purchase-orders/{id}/
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
            description: A unique integer value identifying this purchase order.
        annotations:
          title: Delete a purchase order
          destructive_hint: true
          idempotent_hint: true
      - name: receive-purchase-order
        description: Add received quantities to inventory stock and update the purchase order status (partially_received
          or received). Omit lines to receive everything outstanding. The PO must be submitted, confirmed
          or partially_received.
        method: POST
        path: /mcp-oidc/mfg/purchase-orders/{id}/receive/
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
            description: A unique integer value identifying this purchase order.
        request_body:
          required: false
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        line_id:
                          type: integer
                        quantity:
                          type: integer
                          minimum: 1
                      required:
                        - line_id
                        - quantity
                    description: Lines to receive. Omit to receive everything outstanding.
        annotations:
          title: Receive goods for a purchase order
  - ref: mfg-oidc-shipments-mcp
    ai_gateway: !lookup {name: django-ai-gw}
