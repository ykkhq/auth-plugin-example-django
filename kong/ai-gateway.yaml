        authorization_servers:
          - !env DECK_AUTH0_ISSUER_URL
        endpoint: /mcp-oidc/mfg/shipping-schedule/.well-known/oauth-protected-resource
    tools:
      - name: get-shipping-schedule
        description: Shipments ordered by scheduled ship date. Filter with ship_from / ship_to (dates),
          status and carrier. Shipments without a scheduled date are excluded.
        method: GET
        path: /mcp-oidc/mfg/shipping-schedule/
        parameters:
          - name: carrier
            in: query
            required: false
            schema:
              type: string
          - name: ship_from
            in: query
            required: false
            schema:
              type: string
              format: date
            description: Scheduled ship date on or after (YYYY-MM-DD).
          - name: ship_to
            in: query
            required: false
            schema:
              type: string
              format: date
            description: Scheduled ship date on or before (YYYY-MM-DD).
          - name: status
            in: query
            required: false
            schema:
              type: string
              enum:
                - delivered
                - exception
                - in_transit
                - pending
                - picked
                - returned
                - scheduled
        annotations:
          title: Get the shipping schedule
          read_only_hint: true
  - ref: mfg-oidc-shipping-statuses-mcp
    ai_gateway: !lookup {name: django-ai-gw}
    name: mfg-oidc-shipping-statuses-mcp
    display_name: Manufacturing Shipping Statuses (OIDC)
    type: conversion-listener
    config:
      url: https://host.docker.internal:8443/oidc/mfg/shipping-statuses
      route:
        paths:
          - /mcp-oidc/mfg/shipping-statuses
        strip_path: true
        protocols:
          - http
          - https
      max_request_body_size: 32768
      server:
        timeout: 60000
        forward_client_headers: true
    access:
      acl_attribute_type: consumer
      auth_strategies:
        - mcp-auth0-oidc
      metadata:
        resource: https://localhost:11443/mcp-oidc/mfg
        authorization_servers:
          - !env DECK_AUTH0_ISSUER_URL
        endpoint: /mcp-oidc/mfg/shipping-statuses/.well-known/oauth-protected-resource
    tools:
      - name: list-shipping-statuses
        description: List shipment status history, newest first. Filter by shipment or status.
        method: GET
        path: /mcp-oidc/mfg/shipping-statuses/
        parameters:
          - name: shipment
            in: query
            required: false
            schema:
              type: integer
          - name: status
            in: query
            required: false
            schema:
              type: string
              enum:
                - delivered
                - exception
                - in_transit
                - pending
                - picked
                - returned
                - scheduled
        annotations:
          title: List shipping status events
          read_only_hint: true
      - name: create-shipping-status
        description: Append a status event and move the shipment to that status. The first in_transit
          deducts the order's line quantities from stock (409 if short) and marks the order shipped; delivered
          marks the order delivered.
        method: POST
        path: /mcp-oidc/mfg/shipping-statuses/
        request_body:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipment:
                    type: integer
                  status:
                    enum:
                      - pending
                      - scheduled
                      - picked
                      - in_transit
                      - delivered
                      - exception
                      - returned
                    type: string
                  location:
                    type: string
                    maxLength: 200
                  note:
                    type: string
                  occurred_at:
                    type: string
                    format: date-time
                    description: Defaults to now.
                required:
                  - shipment
                  - status
        annotations:
          title: Record a new shipping status for a shipment
      - name: get-shipping-status
        description: Retrieve one status event by its id.
        method: GET
        path: /mcp-oidc/mfg/shipping-statuses/{id}/
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
            description: A unique integer value identifying this shipment status event.
        annotations:
          title: Get a shipping status event
          read_only_hint: true
