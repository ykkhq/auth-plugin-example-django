  - ref: mfg-oidc-shipping-schedule-mcp
    ai_gateway: !lookup {name: django-ai-gw}
    name: mfg-oidc-shipping-schedule-mcp
    display_name: Manufacturing Shipping Schedule (OIDC)
    type: conversion-listener
    config:
      url: https://host.docker.internal:8443/oidc/mfg/shipping-schedule
      route:
        paths:
          - /mcp-oidc/mfg/shipping-schedule
        strip_path: true
        protocols:
          - http
