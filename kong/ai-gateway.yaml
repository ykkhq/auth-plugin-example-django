          - !env DECK_AUTH0_ISSUER_URL
        endpoint: /mcp-oidc/mfg/shipments/.well-known/oauth-protected-resource
    tools:
      - name: list-shipments
        description: 'List all shipments. Filter by order or status. Status is read-only here: change
          it by creating a shipping status.'
        method: GET
        path: /mcp-oidc/mfg/shipments/
        parameters:
          - name: order
            in: query
            required: false
            schema:
              type: integer
          - name: status
            in: query
            required: false
            schema:
              type: string
              enum:
                - delivered
                - exception
                - in_transit
                - pending
                - picked
                - returned
                - scheduled
