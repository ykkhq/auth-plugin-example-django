# Konnect resources the demo needs, created by ./start.sh (kongctl, not decK):
#   kongctl apply -f kong/konnect.yaml --pat "$(cat ~/.kong/kpat)"
#
# - Gateway control plane "django-apigw" (its config: kong/kong.yaml, decK)
# - AI Gateway "django-ai-gw" (its MCP server: kong/ai-gateway.yaml, kongctl)
# Each gets the pinned client cert of its local data plane. The certs are
# generated by ./start.sh into gitignored kong/gw-certs/ and kong/ai-certs/.
# ./cleanup.sh deletes both resources again.
control_planes:
- ref: django-apigw
  name: django-apigw
  description: Kong Gateway in front of the Django manufacturing API
  cluster_type: CLUSTER_TYPE_CONTROL_PLANE
  data_plane_certificates:
  - ref: django-apigw-dp-cert
    cert: !file ./gw-certs/tls.crt

ai_gateways:
- ref: django-ai-gw
  name: django-ai-gw
  display_name: django-ai-gw
  description: MCP server for the Django manufacturing API
  deployment_type: hybrid
  data_plane_certificates:
  - ref: django-ai-gw-dp-cert
    title: django-ai-gw local data plane
    cert: !file ./ai-certs/tls.crt

# MCP cost analytics: request volume on django-ai-gw by user, MCP server and
# tool. Yen figures (cost 0.3 / price 1 per request) come from Konnect billing:
# feature mfg_mcp_requests unit cost, see kong/mcp_billing.py --cost.
analytics:
  dashboards:
  - ref: mcp-cost-analytics
    name: MCP Cost Analytics (django-ai-gw)
    definition:
      preset_filters:
      - field: control_plane
        operator: in
        value:
        - !ref django-ai-gw#id
      tiles:
      - type: chart
        layout: {position: {col: 0, row: 0}, size: {cols: 2, rows: 1}}
        definition:
          chart: {type: single_value, chart_title: "MCP requests (x 0.3 JPY = cost)"}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            filters: [{field: mcp_method, operator: not_empty}]
      - type: chart
        layout: {position: {col: 2, row: 0}, size: {cols: 2, rows: 1}}
        definition:
          chart: {type: single_value, chart_title: "Error rate (billed but failed)", decimal_points: 1}
          query:
            datasource: agentic_usage
            metrics: [error_rate]
            filters: [{field: mcp_method, operator: not_empty}]
      - type: chart
        layout: {position: {col: 4, row: 0}, size: {cols: 2, rows: 2}}
        definition:
          chart: {type: donut, chart_title: Requests by user (cost share)}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [consumer]
            filters: [{field: consumer, operator: not_empty}]
      - type: chart
        layout: {position: {col: 0, row: 1}, size: {cols: 4, rows: 2}}
        definition:
          chart: {type: timeseries_bar, chart_title: Requests over time by user, stacked: true}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [consumer, time]
            filters: [{field: consumer, operator: not_empty}]
      - type: chart
        layout: {position: {col: 4, row: 2}, size: {cols: 2, rows: 2}}
        definition:
          chart: {type: horizontal_bar, chart_title: Requests by JSON-RPC method}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [mcp_method]
            filters: [{field: mcp_method, operator: not_empty}]
      - type: chart
        layout: {position: {col: 0, row: 3}, size: {cols: 2, rows: 2}}
        definition:
          chart: {type: horizontal_bar, chart_title: Requests by MCP server}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [gateway_service]
            filters: [{field: mcp_method, operator: not_empty}]
      - type: chart
        layout: {position: {col: 2, row: 3}, size: {cols: 2, rows: 2}}
        definition:
          chart: {type: top_n, chart_title: Top tools by calls}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [mcp_tool_name]
            filters: [{field: mcp_tool_name, operator: not_empty}]
            limit: 10
      - type: chart
        layout: {position: {col: 4, row: 4}, size: {cols: 2, rows: 1}}
        definition:
          chart: {type: horizontal_bar, chart_title: Tool calls by user and tool, stacked: true}
          query:
            datasource: agentic_usage
            metrics: [request_count]
            dimensions: [consumer, mcp_tool_name]
            filters: [{field: mcp_tool_name, operator: not_empty}]
