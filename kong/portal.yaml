# Konnect API Catalog + Dev Portal for the manufacturing API (kongctl):
#   kongctl apply -f kong/portal.yaml --pat "$(cat ~/.kong/kpat)"
# Applied by ./start.sh after decK sync (the implementation below links to the
# django-api Gateway Service that kong/kong.yaml creates); removed by ./cleanup.sh.
#
# - Portal "manufacturing-portal": built-in developer sign-up/login
#   (email + password), developers auto-approved. Home and Getting started are
#   public; the API reference and the MCP servers page need a login.
# - API "Manufacturing Management API": the public OpenAPI spec (generated by
#   kong/gen_mcp_tools.py), published to the portal, implemented by django-api.
# - MCP servers: Konnect has no portal publication for them, so the portal lists
#   them on a page (kong/portal/mcp-servers.md, generated). They are in the
#   Catalog via kong/catalog_mcp.py.

# Existing resources referenced below, not managed here: the control plane is
# owned by kong/konnect.yaml (kongctl) and the service by kong/kong.yaml (decK).
control_planes:
- ref: django-apigw-ref
  _external:
    selector:
      matchFields:
        name: django-apigw
  gateway_services:
  - ref: django-api-service
    _external:
      selector:
        matchFields:
          name: django-api

portals:
- ref: manufacturing-portal
  name: manufacturing-portal
  display_name: Manufacturing Developer Portal
  description: REST APIs and MCP servers of the Django manufacturing demo
  authentication_enabled: true
  auto_approve_developers: true
  rbac_enabled: false
  default_api_visibility: private
  default_page_visibility: private
  auth_settings:
    ref: manufacturing-portal-auth
    basic_auth_enabled: true
  customization:
    ref: manufacturing-portal-customization
    theme:
      mode: light
      colors:
        primary: "#0c4b33"
    spec_renderer:
      try_it_ui: true
      try_it_insomnia: true
      show_schemas: true
    menu:
      main:
      - path: /apis
        title: APIs
        visibility: private
        external: false
      - path: /mcp-servers
        title: MCP servers
        visibility: private
        external: false
      - path: /getting-started
        title: Getting started
        visibility: public
        external: false
  pages:
  - ref: home
    slug: /
    title: Manufacturing Developer Portal
    visibility: public
    status: published
    content: !file ./portal/home.md
  - ref: getting-started
    slug: getting-started
    title: Getting started
    visibility: public
    status: published
    content: !file ./portal/getting-started.md
  - ref: apis
    slug: apis
    title: APIs
    visibility: private
    status: published
    content: !file ./portal/apis.md
  - ref: mcp-servers
    slug: mcp-servers
    title: MCP servers
    visibility: private
    status: published
    content: !file ./portal/mcp-servers.md

apis:
- ref: manufacturing-api
  name: !file ./openapi/manufacturing-api.yaml#info.title
  description: !file ./openapi/manufacturing-api.yaml#info.description
  version: !file ./openapi/manufacturing-api.yaml#info.version
  slug: manufacturing-api
  labels:
    domain: manufacturing
  versions:
  - ref: manufacturing-api-v1
    version: !file ./openapi/manufacturing-api.yaml#info.version
    spec: !file ./openapi/manufacturing-api.yaml
  implementations:
  - ref: manufacturing-api-impl
    type: service
    service:
      id: !ref django-api-service#id
      control_plane_id: !ref django-apigw-ref#id
  publications:
  - ref: manufacturing-api-pub
    portal_id: !ref manufacturing-portal#id
    visibility: private
