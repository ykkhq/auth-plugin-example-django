# Auth0 user login for the OIDC MCP servers (mfg-oidc-<resource>-mcp in
# kong/ai-gateway.yaml, /mcp-oidc/mfg/<resource>) on AI Gateway "django-ai-gw".
# Applied BEFORE kong/ai-gateway.yaml, whose OIDC servers name this strategy
# in access.auth_strategies (./start.sh does both):
#   source kong/auth0.env
#   kongctl apply -f kong/ai-gateway-oidc.yaml --pat "$(cat ~/.kong/kpat)"
#
#   MCP client --(no token)--> AI GW 401 + WWW-Authenticate resource_metadata=...
#              --(Auth0 login, PKCE, resource=https://localhost:11443/mcp-oidc/mfg)
#              --Bearer JWT--> AI GW: signature/issuer + aud == access.metadata.resource
#              --same JWT (hide_credentials: false)--> Kong GW /oidc/mfg/<resource>
#
# The servers' access.metadata (resource, metadata endpoint) is generated by
# kong/gen_mcp_tools.py; this file holds only what needs Auth0 env values.
#
# Tools by role (MCP_README "Tools by role"): an Auth0 Post-Login Action puts the
# user's roles in the access-token claim mfg_roles. The strategy maps them to the
# consumer groups below (same names as the Auth0 roles), and each OIDC tool's
# access.acls (generated) allows only its roles.
ai_gateway_consumer_groups:
  - ref: mcp-role-sales
    ai_gateway: !lookup {name: django-ai-gw}
    name: sales
    display_name: Sales (Auth0 role)
    policies: []
  - ref: mcp-role-manager
    ai_gateway: !lookup {name: django-ai-gw}
    name: manager
    display_name: Manager (Auth0 role)
    policies: []
  - ref: mcp-role-admin
    ai_gateway: !lookup {name: django-ai-gw}
    name: admin
    display_name: Admin (Auth0 role)
    policies: []
ai_gateway_auth_strategies:
  - ref: mcp-auth0-oidc
    ai_gateway: !lookup {name: django-ai-gw}
    name: mcp-auth0-oidc
    display_name: MCP Auth0 user login
    type: openid-connect
    config:
      # discovery URL; signing keys come from its jwks_uri
      issuer: !env DECK_AUTH0_ISSUER
      # MCP clients send the user's access token; no login redirects here
      auth_methods:
        - bearer
      # Auth0 API identifier = access.metadata.resource of the OIDC servers
      audience_required:
        - https://localhost:11443/mcp-oidc/mfg
      scopes:
        - openid
        - profile
        - email
      cache_tokens_salt: !env DECK_OIDC_CACHE_TOKENS_SALT
      # Auth0 users aren't AI consumers (the apikey users are); usage is still
      # attributed per user by Kong GW (the token's sub, see kong.yaml file-log)
      consumer_optional: true
      # Auth0 roles -> the consumer groups above; a token without a known role is rejected
      consumer_groups_claim:
        - mfg_roles
      consumer_groups_optional: false
      # keep the Authorization header: Kong GW /oidc/mfg validates it again
      hide_credentials: false
