{% extends "inventory/base.html" %}
{% block title %}Delete Item{% endblock %}
{% block content %}
<div class="card">
  <h2>Delete "{{ object.name }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'item-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
