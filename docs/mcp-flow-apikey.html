    for (const n of NODES) if (ids.has(n.id) && n.parent && !ids.has(n.parent)) { ids.add(n.parent); grew = true; }
  }
  for (let i = EDGES.length; i--;) if (!used.has(EDGES[i].id)) EDGES.splice(i, 1);
  for (let i = NODES.length; i--;) if (!ids.has(NODES[i].id)) NODES.splice(i, 1);
  for (const n of NODES) Object.assign(n, overrides[n.id] || {});
  for (const e of EDGES) Object.assign(e, edgeOverrides[e.id] || {});
  for (const id of first) {  // stacked groups lay out children in NODES order
    const n = NODES.splice(NODES.findIndex(m => m.id === id), 1)[0];
    NODES.splice(NODES.findIndex(m => m.parent === n.parent), 0, n);
  }
  for (const k of Object.keys(FLOWS)) if (k !== keep && k !== 'all') delete FLOWS[k];
  FLOWS.all.name = 'Components';
  FLOWS.all.desc = 'Only the components of this flow. Pick the flow tab to step through it.';
  ORDER.splice(0, ORDER.length, keep, 'all');
}

const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const E = Object.fromEntries(EDGES.map(e => [e.id, e]));
const state = { x: 0, y: 0, z: 1, flow: ORDER[0], step: 0, playing: false, sel: null, t0: performance.now() };

// ---------------------------------------------------------------- nodes
const icon = n => `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function nodeHTML(n) {
  let h = `<div class="hd"><div class="ic"${n.tint ? ` style="color:${n.tint}"` : ''}>${icon(n.icon)}</div>
    <div><div class="ti${n.mono ? ' mono' : ''}">${esc(n.title)}</div><div class="su">${esc(n.sub)}</div></div></div>`;
  let b = '';
  if (n.chips) b += `<div class="chips">${n.chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>`;
  if (n.rows) b += n.rows.map(r => `<div class="row"${r.id ? ` data-row="${r.id}"` : ''}><code>${esc(r.k)}</code><span>${esc(r.v)}</span></div>`).join('');
  return b && !n.group ? h + `<div class="body">${b}</div>` : h;
}

for (const n of NODES) {
  const el = document.createElement('div');
  el.className = 'node' + (n.group ? ' group' : '');
  el.dataset.id = n.id;
  if (n.w) el.style.width = n.w + 'px';
  el.innerHTML = nodeHTML(n);
  (n.group ? $('#groups') : $('#nodes')).appendChild(el);
  n.el = el;
}
// Two kinds of gray group box:
//  - stack (default): children are stacked vertically inside it
//  - wrap: children keep the positions given in NODES (canvas coordinates) and
//    the box is sized around them; it may contain stack groups (nesting)
const kidsOf = g => NODES.filter(n => n.parent === g.id);
function fitWrap(g) {
  const kids = kidsOf(g);
  if (!g.placed) {  // first layout: children's canvas coordinates -> relative to the box
    g.x = Math.min(...kids.map(k => k.x)) - 20;
    g.y = Math.min(...kids.map(k => k.y)) - 64;
    for (const k of kids) { k.x -= g.x; k.y -= g.y; }
    g.placed = true;
  }
  g.w = Math.max(...kids.map(k => k.x + k.w)) + 20;
  g.h = Math.max(...kids.map(k => k.y + k.h)) + 20;
  g.el.style.width = g.w + 'px'; g.el.style.height = g.h + 'px';
}
function measure() {
  for (const n of NODES) if (!n.group) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; }
  for (const g of NODES.filter(n => n.group && n.layout !== 'wrap')) {
    const kids = kidsOf(g);
    let y = 64, w = 0;
    for (const k of kids) { k.x = 20; k.y = y; y += k.h + 34; w = Math.max(w, k.w); }
    g.w = w + 40; g.h = y - 34 + 20;
    g.el.style.width = g.w + 'px'; g.el.style.height = g.h + 'px';
  }
  for (const g of NODES.filter(n => n.layout === 'wrap')) fitWrap(g);
}
measure();

function abs(n) {
  if (!n.parent) return { x: n.x, y: n.y };
  const p = abs(byId[n.parent]);
  return { x: p.x + n.x, y: p.y + n.y };
}
function placeNodes() {
  for (const n of NODES) { const a = abs(n); n.el.style.transform = `translate(${a.x}px,${a.y}px)`; }
}

// ---------------------------------------------------------------- edges (React Flow bezier)
function handlePos(id, h) {
  const n = byId[id], a = abs(n);
  let f = h.f ?? .5;
  if (h.row) { const r = n.el.querySelector(`[data-row="${h.row}"]`); f = (r.offsetTop + r.offsetHeight / 2) / n.h; }
  switch (h.s) {
    case 'l': return [a.x, a.y + n.h * f];
    case 'r': return [a.x + n.w, a.y + n.h * f];
    case 't': return [a.x + n.w * f, a.y];
    default: return [a.x + n.w * f, a.y + n.h];
  }
}
const off = d => d >= 0 ? .5 * d : 6.25 * Math.sqrt(-d);
function ctrl(side, [x1, y1], [x2, y2]) {
  switch (side) {
    case 'l': return [x1 - off(x1 - x2), y1];
    case 'r': return [x1 + off(x2 - x1), y1];
    case 't': return [x1, y1 - off(y1 - y2)];
    default: return [x1, y1 + off(y2 - y1)];
  }
}
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return [a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]];
}

const edgesSvg = $('#edges'), labelsG = $('#labels'), handlesG = $('#handles');
for (const e of EDGES) {
  e.path = document.createElementNS(NS, 'path');
  e.path.setAttribute('class', 'edge' + (e.cfg ? ' cfg' : ''));
  edgesSvg.appendChild(e.path);
  e.lg = document.createElementNS(NS, 'g');
  e.lg.setAttribute('class', 'elabel');
  const r = document.createElementNS(NS, 'rect'), t = document.createElementNS(NS, 'text');
  t.textContent = e.label; t.setAttribute('dominant-baseline', 'central'); t.setAttribute('text-anchor', 'middle');
  r.setAttribute('rx', 4); e.lg.append(r, t); labelsG.appendChild(e.lg);
  e.rect = r; e.text = t;
}
function sizeLabels() {
  for (const e of EDGES) {
    e.lw = e.text.getBBox().width + 12; e.lh = 18;
    e.rect.setAttribute('width', e.lw); e.rect.setAttribute('height', e.lh);
    e.rect.setAttribute('x', -e.lw / 2); e.rect.setAttribute('y', -e.lh / 2);
  }
}
sizeLabels();

function layoutEdges() {
  handlesG.innerHTML = '';
  const seen = new Set();
  for (const e of EDGES) {
    const s = handlePos(e.s, e.sh), t = handlePos(e.t, e.th);
    const c1 = ctrl(e.sh.s, s, t), c2 = ctrl(e.th.s, t, s);
    e.path.setAttribute('d', `M${s} C${c1} ${c2} ${t}`);
    const [lx, ly] = bez(s, c1, c2, t, e.lt);
    e.lg.setAttribute('transform', `translate(${lx},${ly})`);
    for (const p of [s, t]) {
      const k = p.map(v => v.toFixed(1)).join();
      if (seen.has(k)) continue;
      seen.add(k);
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'handle'); c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 3.5);
      handlesG.appendChild(c);
    }
  }
}

// ---------------------------------------------------------------- flow state
function applyFlow() {
  const f = FLOWS[state.flow];
  document.documentElement.style.setProperty('--flow', f.color);
  const inE = new Set((f.steps || []).map(s => s.e));
  const inN = new Set();
  inE.forEach(id => { inN.add(E[id].s); inN.add(E[id].t); });
  for (const id of [...inN]) for (let p = byId[id].parent; p; p = byId[p].parent) inN.add(p);
  const cur = f.steps ? f.steps[state.step] : null;

  for (const e of EDGES) {
    const isIn = inE.has(e.id), dim = !!f.steps && !isIn, isCur = cur && cur.e === e.id;
    const hl = !f.steps && state.sel && (e.s === state.sel || e.t === state.sel);
    e.path.classList.toggle('in', isIn);
    e.path.classList.toggle('dim', dim);
    e.path.classList.toggle('cur', !!isCur);
    e.path.classList.toggle('hl', !!hl);
    e.path.setAttribute('marker-end', `url(#m-${isIn ? 'flow' : dim ? 'dim' : hl ? 'hl' : 'def'})`);
    e.lg.classList.toggle('dim', dim);
    e.lg.classList.toggle('cur', !!isCur);
  }
  for (const n of NODES) {
    n.el.classList.toggle('dim', !!f.steps && !inN.has(n.id));
    n.el.classList.toggle('on', !!cur && !n.group && (E[cur.e].s === n.id || E[cur.e].t === n.id));
    n.el.classList.toggle('sel', state.sel === n.id);
  }
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.f === state.flow));
  renderSteps();
  state.t0 = performance.now();
}

function renderSteps() {
  const f = FLOWS[state.flow], list = $('#list');
  $('#sTitle').innerHTML = `<span class="sw" style="background:${f.color}"></span>${esc(f.name)}`;
  $('#sDesc').textContent = f.desc;
  list.innerHTML = '';
  if (!f.steps) {
    list.className = 'legend';
    for (const k of ORDER.slice(0, -1)) {
      const g = FLOWS[k], li = document.createElement('li');
      li.innerHTML = `<span class="sw" style="background:${g.color}"></span><div><b>${esc(g.name)}</b><code>${esc(g.desc)}</code></div>`;
      li.onclick = () => setFlow(k);
      list.appendChild(li);
    }
    $('#sFoot').style.display = 'none';
    return;
  }
  list.className = '';
  $('#sFoot').style.display = '';
  f.steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = i === state.step ? 'cur' : i < state.step ? 'done' : '';
    li.innerHTML = `<span class="n">${i + 1}</span><div><b>${esc(s.t)}<span class="dir">${s.d < 0 ? '← response' : ''}</span></b><code>${esc(s.c)}</code></div>`;
    li.onclick = () => { stop(); setStep(i); };
    list.appendChild(li);
  });
  list.children[state.step]?.scrollIntoView({ block: 'nearest' });
  $('#count').textContent = `${state.step + 1} / ${f.steps.length}`;
}

function setFlow(k) { stop(); state.flow = k; state.step = 0; state.sel = null; applyFlow(); }
function setStep(i) {
  const n = FLOWS[state.flow].steps?.length;
  if (!n) return;
  state.step = (i + n) % n;
  applyFlow();
}
let timer = null;
function play() {
  state.playing = true; $('#play').textContent = '❚❚ Pause';
  timer = setInterval(() => setStep(state.step + 1), 2200);
}
function stop() { state.playing = false; clearInterval(timer); $('#play').textContent = '▶ Play'; }

const tabs = $('#tabs');
for (const k of ORDER) {
  const b = document.createElement('button');
  b.className = 'tab'; b.dataset.f = k; b.setAttribute('role', 'tab');
  b.innerHTML = `<span class="sw" style="background:${FLOWS[k].color}"></span>${esc(FLOWS[k].name)}`;
  b.onclick = () => setFlow(k);
  tabs.appendChild(b);
}
$('#prev').onclick = () => { stop(); setStep(state.step - 1); };
$('#next').onclick = () => { stop(); setStep(state.step + 1); };
$('#play').onclick = () => state.playing ? stop() : play();
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); setStep(state.step + 1); }
  if (e.key === 'ArrowLeft') { stop(); setStep(state.step - 1); }
  if (e.key === ' ' && FLOWS[state.flow].steps) { e.preventDefault(); state.playing ? stop() : play(); }
});

// moving packet along the current step's edge
const dot = $('#dot'), ring = $('#dotRing');
function tick(now) {
  const f = FLOWS[state.flow], cur = f.steps && f.steps[state.step];
  if (cur) {
    const p = E[cur.e].path, len = p.getTotalLength();
    let t = ((now - state.t0) % 1500) / 1500;
    t = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pt = p.getPointAtLength(len * (cur.d > 0 ? t : 1 - t));
    for (const c of [dot, ring]) { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('visibility', 'visible'); }
  } else {
    dot.setAttribute('visibility', 'hidden'); ring.setAttribute('visibility', 'hidden');
  }
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- viewport
const flow = $('#flow'), vp = $('#vp');
function applyView() {
  vp.style.transform = `translate(${state.x}px,${state.y}px) scale(${state.z})`;
  flow.style.backgroundSize = `${20 * state.z}px ${20 * state.z}px`;
  flow.style.backgroundPosition = `${state.x}px ${state.y}px`;
  drawMini();
}
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of NODES) { const a = abs(n); x0 = Math.min(x0, a.x); y0 = Math.min(y0, a.y); x1 = Math.max(x1, a.x + n.w); y1 = Math.max(y1, a.y + n.h); }
  return { x0, y0, x1, y1 };
}
function fit() {
  const b = bounds(), W = innerWidth, H = innerHeight, mobile = W <= 760;
  const L = 16, T = $('#title').offsetHeight + 28;
  const R = mobile ? W - 16 : W - $('#steps').offsetWidth - 32;
  const B = mobile ? H - $('#steps').offsetHeight - 28 : H - 16;
  const aw = R - L, ah = B - T, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const z = Math.max(.2, Math.min(1.1, Math.min(aw / bw, ah / bh) * .96));
  state.z = z;
  state.x = L + (aw - bw * z) / 2 - b.x0 * z;
  state.y = T + (ah - bh * z) / 2 - b.y0 * z;
  applyView();
}
function zoomAt(k, cx, cy) {
  const nz = Math.max(.2, Math.min(2.2, state.z * k));
  state.x = cx - (cx - state.x) * (nz / state.z);
  state.y = cy - (cy - state.y) * (nz / state.z);
  state.z = nz;
  applyView();
}
flow.addEventListener('wheel', e => {
  if (e.target.closest('.panel')) return;
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY);
}, { passive: false });
$('#zin').onclick = () => zoomAt(1.2, innerWidth / 2, innerHeight / 2);
$('#zout').onclick = () => zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
$('#fit').onclick = fit;
$('#theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

// pan the canvas or drag a node
let drag = null;
flow.addEventListener('pointerdown', e => {
  if (e.target.closest('.panel') || e.button > 0) return;
  const nodeEl = e.target.closest('.node');
  drag = { px: e.clientX, py: e.clientY, sx: e.clientX, sy: e.clientY, node: nodeEl ? byId[nodeEl.dataset.id] : null };
  if (drag.node) nodeEl.classList.add('dragging'); else flow.classList.add('panning');
  flow.setPointerCapture(e.pointerId);
});
flow.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
  drag.px = e.clientX; drag.py = e.clientY;
  if (drag.node) {
    drag.node.x += dx / state.z; drag.node.y += dy / state.z;
    for (const g of NODES.filter(n => n.layout === 'wrap')) fitWrap(g);
    placeNodes(); layoutEdges(); drawMini();
  } else {
    state.x += dx; state.y += dy; applyView();
  }
});
flow.addEventListener('pointerup', e => {
  if (!drag) return;
  const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 3;
  if (!moved) {
    state.sel = drag.node && state.sel !== drag.node.id ? drag.node.id : null;
    if (state.sel && FLOWS[state.flow].steps) { stop(); state.flow = 'all'; }
    applyFlow();
  }
  drag.node?.el.classList.remove('dragging');
  flow.classList.remove('panning');
  drag = null;
});

// ---------------------------------------------------------------- minimap
const mini = $('#mini');
function drawMini() {
  if ($('#minimap').offsetParent === null) return;
  const b = bounds(), pad = 80;
  const W = innerWidth, H = innerHeight;
  const vx = -state.x / state.z, vy = -state.y / state.z, vw = W / state.z, vh = H / state.z;
  const x0 = Math.min(b.x0 - pad, vx), y0 = Math.min(b.y0 - pad, vy);
  const x1 = Math.max(b.x1 + pad, vx + vw), y1 = Math.max(b.y1 + pad, vy + vh);
  mini.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
  mini.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  let s = '';
  for (const n of NODES) {
    const a = abs(n);
    s += `<rect class="${n.group ? 'mg' : 'mn'}" x="${a.x}" y="${a.y}" width="${n.w}" height="${n.h}" rx="${n.group ? 14 : 8}"/>`;
  }
  const big = 1e5;
  s += `<path class="mask" d="M${x0 - big},${y0 - big}h${x1 - x0 + 2 * big}v${y1 - y0 + 2 * big}h${-(x1 - x0 + 2 * big)}z M${vx},${vy}h${vw}v${vh}h${-vw}z"/>`;
  mini.innerHTML = s;
}
let miniDrag = false;
function miniPan(e) {
  const pt = mini.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const w = pt.matrixTransform(mini.getScreenCTM().inverse());
  state.x = innerWidth / 2 - w.x * state.z;
  state.y = innerHeight / 2 - w.y * state.z;
  applyView();
}
$('#minimap').addEventListener('pointerdown', e => { miniDrag = true; e.currentTarget.setPointerCapture(e.pointerId); miniPan(e); });
$('#minimap').addEventListener('pointermove', e => miniDrag && miniPan(e));
$('#minimap').addEventListener('pointerup', () => miniDrag = false);

// ---------------------------------------------------------------- init
placeNodes();
layoutEdges();
applyFlow();
fit();
addEventListener('resize', fit);
requestAnimationFrame(tick);
// re-measure once web fonts are in, since node sizes depend on them
document.fonts?.ready.then(() => { measure(); sizeLabels(); placeNodes(); layoutEdges(); fit(); });
})();
</script>
</body>
</html>
